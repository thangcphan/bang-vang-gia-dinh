<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Vàng Tích Điểm Gia Đình - Kids Quest</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Nunito & Quicksand cho nét chữ tròn trịa, thân thiện -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti cho hiệu ứng pháo hoa ăn mừng -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'Quicksand', 'sans-serif'],
                    },
                    animation: {
                        'bounce-slow': 'bounce 2s infinite',
                        'wiggle': 'wiggle 1s ease-in-out infinite',
                        'pulse-fast': 'pulse 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 3s ease-in-out infinite',
                    },
                    keyframes: {
                        wiggle: {
                            '0%, 100%': { transform: 'rotate(-3deg)' },
                            '50%': { transform: 'rotate(3deg)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-6px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f0f7ff;
            background-image: radial-gradient(#bae6fd 1.5px, transparent 1.5px), radial-gradient(#e0f2fe 1.5px, #f0f7ff 1.5px);
            background-size: 36px 36px;
            background-position: 0 0, 18px 18px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Hiệu ứng nút bấm nổi 3D chuẩn game */
        .btn-game {
            transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.18);
        }
        .btn-game:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 0px 0 rgba(0, 0, 0, 0.18);
        }

        /* Tùy chỉnh thanh cuộn mượt */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Hiệu ứng ánh sáng lấp lánh trên thanh XP */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .xp-shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            background-size: 200% 100%;
            animation: shimmer 2.5s infinite;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- HEADER / THANH ĐIỀU HƯỚNG TRÊN CÙNG -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b-2 border-sky-100 shadow-sm">
        <div class="max-w-6xl mx-auto px-3 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-2">
            <!-- Logo & Tiêu đề -->
            <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-2xl bg-gradient-to-tr from-amber-400 to-orange-500 flex items-center justify-center text-white text-xl sm:text-2xl shadow-md animate-float">
                    👑
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-black bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 bg-clip-text text-transparent leading-tight">
                        Bảng Vàng Chăm Ngoan
                    </h1>
                    <p class="text-[11px] sm:text-xs font-bold text-slate-400">Tích điểm mỗi ngày • Đổi quà cực mê!</p>
                </div>
            </div>

            <!-- Các nút điều khiển bên phải -->
            <div class="flex items-center gap-2 sm:gap-3">
                <!-- Huy hiệu trạng thái đồng bộ Firebase -->
                <div id="syncStatusBadge" onclick="handleParentModeClick()" title="Trạng thái đồng bộ Cloud"
                    class="cursor-pointer px-2.5 sm:px-3 py-1.5 rounded-xl bg-slate-100 border border-slate-200 text-slate-600 text-[11px] sm:text-xs font-extrabold flex items-center gap-1.5">
                    <span id="syncDot" class="w-2 h-2 rounded-full bg-slate-400"></span>
                    <span id="syncStatusText" class="hidden sm:inline">Lưu trên máy</span>
                </div>

                <!-- Nút Bật/Tắt Âm Thanh -->
                <button id="soundToggleBtn" onclick="toggleSound()" title="Bật/Tắt âm thanh"
                    class="btn-game w-10 h-10 rounded-xl bg-sky-100 hover:bg-sky-200 text-sky-600 flex items-center justify-center text-lg font-bold">
                    <i id="soundIcon" class="fa-solid fa-volume-high"></i>
                </button>

                <!-- Nút Chuyển Chế Độ Bố Mẹ (Admin) -->
                <button id="parentModeBtn" onclick="handleParentModeClick()"
                    class="btn-game relative px-3.5 sm:px-4 py-2 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-extrabold text-xs sm:text-sm flex items-center gap-2">
                    <i id="parentLockIcon" class="fa-solid fa-lock"></i>
                    <span id="parentModeText">Góc Bố Mẹ</span>
                    <!-- Badge đếm số yêu cầu chờ duyệt -->
                    <span id="pendingBadge" class="hidden absolute -top-2 -right-2 bg-rose-500 text-white text-xs font-black w-6 h-6 rounded-full flex items-center justify-center border-2 border-white animate-bounce">
                        0
                    </span>
                </button>
            </div>
        </div>
    </header>

    <!-- NỘI DUNG CHÍNH -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-3 sm:px-6 py-5 space-y-6">

        <!-- KHU VỰC 1: THẺ NHÂN VẬT CỦA 2 BÉ (PROFILE CARDS) -->
        <section id="kidsProfileSection" class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
            <!-- Sẽ được render tự động bằng JavaScript -->
        </section>

        <!-- KHU VỰC CHUYỂN ĐỔI TAB (NHIỆM VỤ / CỬA HÀNG QUÀ / LỊCH SỬ / GÓC BỐ MẸ) -->
        <div id="mainDashboardView" class="space-y-5">
            <!-- Thanh chọn Tab -->
            <div class="bg-white p-2 rounded-2xl shadow-sm border-2 border-slate-100 flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center gap-1.5 sm:gap-2 flex-1 sm:flex-initial">
                    <button onclick="switchTab('tasks')" id="tab-tasks"
                        class="tab-btn flex-1 sm:flex-initial px-3.5 sm:px-5 py-2.5 rounded-xl font-extrabold text-xs sm:text-sm flex items-center justify-center gap-2 transition-all bg-amber-400 text-amber-950 shadow-sm">
                        <span>🎯</span> Nhiệm Vụ & Quy Tắc
                    </button>
                    <button onclick="switchTab('shop')" id="tab-shop"
                        class="tab-btn flex-1 sm:flex-initial px-3.5 sm:px-5 py-2.5 rounded-xl font-extrabold text-xs sm:text-sm flex items-center justify-center gap-2 transition-all text-slate-600 hover:bg-slate-100">
                        <span>🎁</span> Cửa Hàng Đổi Quà
